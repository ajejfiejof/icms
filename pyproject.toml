[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icms"
version = "0.1.0"
description = "The Idempotent Count-Min Lattice (iCMS): Constant-Memory Strong Eventual Consistent Streaming Frequency Sketch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "ajejfiejof" }
]
keywords = ["crdt", "streaming", "sketch", "count-min", "hyperloglog", "formal-verification", "z3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "z3-solver>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/ajejfiejof/icms"
Repository = "https://github.com/ajejfiejof/icms.git"
